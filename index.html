 )</td><td></td><td>( )</td></tr><tr><td class=\"rowhd\">R G3</td><td></td><td>X</td><td>( )</td></tr><tr><td class=\"rowhd\">R G4</td><td></td><td></td><td>( )</td></tr></table><div class=\"qbul\"><span class=\"item\">R : 무선할당</span><span class=\"item\">X : 실험처치</span><span class=\"item\">G1 : 실험집단1, G2 : 통제집단1, G3 : 실험집단2, G4 : 통제집단2</span><span class=\"item\">( ) : 검사 시점(사전/사후)</span></div></div>","1-research-2020-68":"<span class=\"leadline\">성차별예방 프로그램(group: 실험집단, 비교집단, 통제집단)과 성별(gender: 남, 여)이 성감수성 변화에 효과가 있는지를 알아보고자 하였다. 세 집단에 각각 남학생 10명, 여학생 10명씩을 배치한 요인설계로 분산분석한 결과이다. (ㅁ)과 (ㅅ)에 들어갈 숫자의 합은?</span><div class=\"qfig\"><table class=\"qtbl\"><tr><th>source</th><th>df</th><th>SS</th><th>MS</th><th>F</th></tr><tr><td class=\"rowhd\">group (A)</td><td>(ㄱ)</td><td>400</td><td>(ㄹ)</td><td>(ㅅ)</td></tr><tr><td class=\"rowhd\">gender (B)</td><td>-</td><td>200</td><td>-</td><td>-</td></tr><tr><td class=\"rowhd\">A × B</td><td>(ㄴ)</td><td>300</td><td>(ㅁ)</td><td>-</td></tr><tr><td class=\"rowhd\">error</td><td>(ㄷ)</td><td>5,400</td><td>(ㅂ)</td><td>-</td></tr></table></div>","1-research-2020-71":"<span class=\"leadline\">부모의 양육유형에 따른 고등학생의 정서에 차이가 있는지를 알아보기 위해 MANOVA를 실시한 결과이다. 분석결과에 관한 설명으로 옳지 않은 것은?</span><div class=\"qfig\"><div class=\"qfig-title\">Wilks' λ (p=.00)</div><table class=\"qtbl\"><tr><th>IV</th><th>DV</th><th>단변량 F</th><th>df</th><th>유의확률</th><th>단계적 F</th><th>df</th><th>유의확률</th></tr><tr><td class=\"rowhd\" rowspan=\"5\">양육 유형</td><td class=\"left\">수치심</td><td>53.34</td><td>( )</td><td>.00</td><td>53.34</td><td>( )</td><td>.00</td></tr><tr><td class=\"left\">분노</td><td>46.38</td><td>( )</td><td>.00</td><td>20.30</td><td>( )</td><td>.00</td></tr><tr><td class=\"left\">외로움</td><td>120.23</td><td>( )</td><td>.00</td><td>59.30</td><td>( )</td><td>.00</td></tr><tr><td class=\"left\">강박</td><td>50.36</td><td>( )</td><td>.00</td><td>6.21</td><td>( )</td><td>.00</td></tr><tr><td class=\"left\">무력감</td><td>45.23</td><td>( )</td><td>.00</td><td>3.21</td><td>( )</ lass=\"qfig\"><table class=\"qtbl\"><thead><tr><th>Source</th><th>SS</th><th>df</th><th>MS</th><th>F</th><th>p</th></tr></thead><tbody><tr><td class=\"rowhd\">피험자 간: 집단(A)</td><td>1.48</td><td>(X)</td><td>( )</td><td>.017</td><td>.897</td></tr><tr><td class=\"rowhd\">피험자 간: 오차</td><td>5,032.94</td><td>58</td><td>( )</td><td>—</td><td>—</td></tr><tr><td class=\"rowhd\">피험자 내: 측정시점(B)</td><td>1,998.72</td><td>(Y)</td><td>( )</td><td>9.873</td><td>.000</td></tr><tr><td class=\"rowhd\">피험자 내: A×B</td><td>861.08</td><td>(Z)</td><td>( )</td><td>4.253</td><td>.016</td></tr><tr><td class=\"rowhd\">피험자 내: 오차(측정시점)</td><td>11,741.48</td><td>116</td><td>( )</td><td>—</td><td>—</td></tr></tbody></table></div><div class=\"qbul\"><span class=\"item\">ㄱ. X+Y+Z=5이다.</span><span class=\"item\">ㄴ. p=.897은 마무리 시점에서 두 집단의 자존감 평균 차이가 유의미하지 않음을 의미한다.</span><span class=\"item\">ㄷ. 두 프로그램 P₁, P₂의 효과는 유의수준 5%에서 유의미한 차이가 있다.</span></div>","1-research-2017-62":"<span class=\"leadline\">전국에서 세 학교(A)를 임의 추출하고, 각 학교에서 두 학급(B)씩 임의 추출하고, 각 학급에서 여섯 명의 학생(S)을 추출하여 교우 관계를 조사했다. 아래 분산분석표에서 F_A와 F_B(A)를 합하면?</span><div class=\"qfig\"><table class=\"qtbl\"><thead><tr><th>변산원</th><th>자유도</th><th>제곱합</th><th>평균제곱</th><th>F</th></tr></thead><tbody><tr><td class=\"rowhd\">A</td><td>2</td><td>200</td><td>100</td><td>F_A</td></tr><tr><td class=\"rowhd\">B(A)</td><td>3</td><td>30</td><td>10</td><td>F_B(A)</td></tr><tr><td class=\"rowhd\">S(AB)</td><td>30</td><td>300</td><td>100</td><td>(생략)</td></tr><tr><td class=\"rowhd\">전체</td><td>35</td><td>530</td><td>—</td><td>—</td></tr></tbody></table></div><div class=\"qfig-note\">※ OCR 복원본의 S(AB) 행에서 제곱합/자유도와 평균제곱이 서로 맞지 않습니다. 원본 시험지 표 확인 전까지 수치 검증 보류.</div>","1-research-2017-59":"<span class=\"leadline\">분산분석표(A: 반복측정, B: 상담방법, S: 내담자)를 보고 알 수 있는 연구 설계의 특징으로 옳은 것은?</span><div class=\"qfig\"><table class=\"qtbl\"><thead><tr><th>구분</th><th>변산원</th><th>자유도</th></tr></thead><tbody><tr><td class=\"rowhd\">대상 간</td><td>합계</td><td>5</td></tr><tr><td></td><td>B</td><td>1</td></tr><tr><td></td><td>S(B)</td><td>4</td></tr><tr><td class=\"rowhd\">대상 내</td><td>합계</td><td>18</td></tr><tr><td></td><td>A</td><td>3</td></tr><tr><td></td><td>AB</td><td>3</td></tr><tr><td></td><td>AS(B)</td><td>12</td></tr><tr><td class=\"rowhd\">전체</td><td>—</td><td>23</td></tr></tbody></table><div class=\"qfig-title\">원문에는 제곱합·평균제곱·F·p 열의 값 일부가 생략되어 있습니다.</div></div>","1-research-2018-66":"<span class=\"leadline\">다음은 부모양육태도·심리적 안정성·사회성의 상관계수표이다. 부모양육태도를 통제한 심리적 안정성과 사회성의 부분상관계수는? (소수점 셋째 자리에서 반올림)</span><div class=\"qfig\"><table class=\"qtbl\"><thead><tr><th></th><th>부모양육태도</th><th>심리적 안정성</th><th>사회성</th></tr></thead><tbody><tr><td class=\"rowhd\">부모양육태도</td><td>1.00</td><td>0.40</td><td>0.50</td></tr><tr><td class=\"rowhd\">심리적 안정성</td><td>—</td><td>1.00</td><td>0.80</td></tr><tr><td class=\"rowhd\">사회성</td><td>—</td><td>—</td><td>1.00</td></tr></tbody></table></div><div class=\"qfig\"><div class=\"qfig-title\">문제에 제시된 제곱근 근삿값</div><div>√0.75~√0.76 = 0.87 · √0.77~√0.78 = 0.88 · √0.79~√0.80 = 0.89 · √0.81 = 0.90 · √0.82~√0.83 = 0.91 · √0.84~√0.85 = 0.92</div><div class=\"qfig-title\">부분상관 공식: r₁₂·₃ = (r₁₂−r₁₃r₂₃) / [√(1−r₁₃²)√(1−r₂₃²)]</div></div>","1-research-2025-59":"<span class=\"leadline\">다음 ( )에 들어갈 값으로 옳은 것은?</span><div class=\"qfig\"><div class=\"qbul\"><span class=\"item\">• 고등학교 4곳에서 각각 30명씩 학생을 추출했다.</span><span class=\"item\">• 자율학습 효율성을 평가하기 위해 일원분산분석(ANOVA)을 실시하고자 한다.</span><span class=\"item\">• 집단 간 자유도는 (ㄱ), 집단 내 자유도는 (ㄴ)이다.</span></div></div>"};

const gradesInBank=()=>[...new Set(BANK.map(q=>q.grade))].sort();

 const sChip=k=>`<button class="chip" data-s="${k}" aria-pressed="${sel.subjs.has(k)}">${esc(SUBJECTS[k].name)} <span class="badge">${BANK.filter(q=>q.grade===sel.grade&&[...sel.years].includes(q.year)&&q.subj===k).length}</span></button>`;
 app.innerHTML=`<div class="brand"><span class="dot">🐢</span> 거북이심리상담센터 · 수련도구</div>
 <h1>청소년상담사 기출 CBT</h1><p class="lead">급수·연도·과목을 골라 푸는 기출 연습 도구. 객관식 5지택일, 실제 최종정답 기준 채점.</p>
 <div class="card">
  <div class="sec-label"><span class="ix">1</span> 급수</div><div class="chiprow">${gradeChips}</div>

 </div>

 document.getElementById('sall').addEventListener('click',()=>{sel.subjs=new Set(sel.subjs.size===subjs.length?[subjs[0]]:subjs);renderStart();});
 document.querySelectorAll('#seg-order button').forEach(b=>b.addEventListener('click',()=>{sel.order=b.dataset.o;renderStart();}));

 const sb=document.getElementById('start');if(sb&&!sb.disabled)sb.addEventListener('click',startQuiz);

 S={qs,cur:0,ans:new Array(qs.length).fill(null),checked:new Array(qs.length).fill(false),grade2:sel.grade2};

  return `<div class="opt ${show?'locked':''}" data-k="${k}" ${st?`data-state="${st}"`:""}><span class="num">${CIRC[k]}</span><span class="txt">${renderAnsText(o)}</span></div>`;}).join("");
 app.innerHTML=`<div class="qbar"><span class="qmeta">${i+1} / ${total}</span><div class="prog"><i style="width:${Math.round((i+1)/total*100)}%"></i></div><button class="btn ghost row" id="quit">나가기</button></div>
 <div class="card"><span class="qtag" style="background:${col}">${q.year} 제${ROUND[q.year]||"?"}회 · ${esc(SUBJECTS[q.subj].name)} ${q.n}번</span>
 ${renderQBody(q)}<div id="opts">${opts}</div>
 ${show?`<div class="exp"><b>${isCorrect(q,picked)?"정답":"오답"}</b> · 정답 ${ansTxt}${q.a.length>1?" (복수정답)":""}${q.ex?"<br>"+escReadable(q.ex):""}</div>`:""}</div>
 <div class="nav"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>이전</button>
 ${S.grade2==="instant"&&!S.checked[i]?`<button class="btn" id="check" ${picked===null?"disabled":""}>채점</button>`:`<button class="btn" id="next">${i===total-1?"결과 보기":"다음"}</button>`}</div>`;
 if(!show)app.querySelectorAll('.opt').forEach(el=>el.addEventListener('click',()=>{S.ans[i]=+el.dataset.k;if(S.grade2==="instant")renderQ();else{app.querySelectorAll('.opt').forEach(o=>o.removeAttribute('data-state'));el.setAttribute('data-state','sel');}}));
 const p=document.getElementById('prev');if(p)p.addEventListener('click',()=>{S.cur--;renderQ();});
 const c=document.getElementById('check');if(c)c.addEventListener('click',()=>{S.checked[i]=true;renderQ();});
 const nx=document.getElementById('next');if(nx)nx.addEventListener('click',()=>{if(i===total-1){if(S.grade2==="end")S.checked=S.checked.map(()=>true);renderResult();}else{S.cur++;renderQ();}});
 document.getElementById('quit').addEventListener('click',confirmExit);
}
function confirmExit(){
 if(document.getElementById('cfm'))return;
 const bar=document.createElement('div');bar.className="cfm";bar.id="cfm";
 bar.innerHTML=`<p>풀이를 중단하고 처음으로 돌아갈까요? 진행 중인 답안은 사라집니다.</p><div class="row"><button class="btn" id="cfm-yes">나가기</button><button class="btn ghost" id="cfm-no">계속 풀기</button></div>`;
 app.prepend(bar);window.scrollTo(0,0);
 document.getElementById('cfm-yes').addEventListener('click',renderStart);
 document.getElementById('cfm-no').addEventListener('click',()=>bar.remove());
}
function renderResult(){
 const qs=S.qs,total=qs.length;let ok=0;const by={};const wrong=[];
 qs.forEach((q,i)=>{const c=isCorrect(q,S.ans[i]);if(c)ok++;else wrong.push(i);(by[q.subj]=by[q.subj]||{ok:0,all:0});by[q.subj].all++;if(c)by[q.subj].ok++;});
 const pct=Math.round(ok/total*100);const ks=Object.keys(by);
 const avg=Math.round(ks.reduce((t,k)=>t+by[k].ok/by[k].all*100,0)/ks.length);
 const fail=ks.some(k=>by[k].ok/by[k].all*100<40);const pass=avg>=60&&!fail;
 app.innerHTML=`<div class="brand"><span class="dot">🐢</span> 결과</div>
 <div class="card"><div class="score-hero"><div class="big">${pct}<span style="font-size:24px;color:var(--sub)">점</span></div>
 <div class="lab">${total}문항 중 ${ok}문항 정답</div><div class="verdict ${pass?'pass':'fail'}">${pass?'합격선 통과':'합격선 미달'} · 평균 ${avg}점</div></div></div>
 <div class="card"><div class="sec-label"><span class="ix">✓</span> 과목별 결과</div>
 ${ks.map(k=>{const s=by[k],pp=Math.round(s.ok/s.all*100),fl=pp<40;return `<div class="sline"><span class="nm">${esc(SUBJECTS[k].name)}<small>${s.ok}/${s.all}</small>${fl?'<span class="tagmini">과락</span>':''}</span><span class="sc ${pp>=60?'pass':(fl?'fail':'')}">${pp}점</span></div>`;}).join("")}
 <div class="foot" style="text-align:left;margin-top:12px">※ 과락·합격선 판정은 선택한 문항 기준이라 정식 시험(과목당 25문항)과 다를 수 있어요.</div></div>
 ${wrong.length?`<div class="card"><div class="sec-label"><span class="ix">✗</span> 오답 리뷰 (${wrong.length})</div>
 ${wrong.map(i=>{const q=qs[i],my=S.ans[i],col=SUBJECTS[q.subj].color,at=q.a.map(x=>CIRC[x]+' '+renderAnsText(q.opts[x])).join(' / ');return `<div class="rv-item"><span class="qtag" style="background:${col}">${q.year} · ${esc(SUBJECTS[q.subj].name)} ${q.n}번</span>
 ${renderQBody(q,true)}<div class="wa"><span class="you">내 답: ${my===null?'무응답':CIRC[my]+' '+renderAnsText(q.opts[my])}</span><br><span class="ans">정답: ${at}</span></div>${q.ex?`<div class="exp">${escReadable(q.ex)}</div>`:""}</div>`;}).join("")}</div>`:`<div class="card"><p class="lead" style="text-align:center">전부 맞혔습니다. 🎉</p></div>`}
 <div class="nav">${wrong.length?`<button class="btn" id="retry">오답만 다시 풀기</button>`:""}<button class="btn ghost" id="home">처음으로</button></div>`;
 const rt=document.getElementById('retry');if(rt)rt.addEventListener('click',()=>{const q2=wrong.map(i=>S.qs[i]);S={qs:q2,cur:0,ans:new Array(q2.length).fill(null),checked:new Array(q2.length).fill(false),grade2:S.grade2};renderQ();});
 document.getElementById('home').addEventListener('click',renderStart);
}
renderStart();
</script></body></html>
